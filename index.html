              "@type": "Question",
              "name": "Do I need a Mac to join?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Builder and Core members get scheduled access to the PIT Mac Lab (Block B, 3rd floor) with Xcode pre-installed. Many members start on the lab machines and buy a used Mac later — we keep a list of trusted sellers too."
              }
            },
            {
              "@type": "Question",
              "name": "I've never coded before. Is this for me?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. We start from Swift fundamentals — variables, optionals, functions — before touching SwiftUI. We pace the first four weeks for absolute beginners, and mentors run extra 'zero-to-Xcode' sessions on Saturdays."
              }
            },
            {
              "@type": "Question",
              "name": "Which branches or years can join?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every student of Parul University, from any faculty and any year. Our current members include CSE, IT, BCA, Design, Pharmacy and MBA students."
              }
            },
            {
              "@type": "Question",
              "name": "How much time does it take each week?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "About 4–5 hours: one 2-hour Thursday lab, a 1-hour mentor check-in, and self-paced build time. Capstone weeks (weeks 10–14) can run heavier, and we plan around exams."
              }
            },
            {
              "@type": "Question",
              "name": "Will my app actually be on the App Store?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "If it passes our internal review and Apple's guidelines, yes. Members publish under the club's Apple Developer team at no extra cost. 12 student apps have launched so far; you retain full ownership of your code and IP."
              }
            },
            {
              "@type": "Question",
              "name": "What about Android or cross-platform?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We're a Swift-first club by design — depth over breadth. That said, we run occasional sessions on Swift on the server and shared-logic patterns, and collaborate with GDG Vadodara for Android events."
              }
            }
          ]
        }
